<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#254d3b"><meta name="description" content="A simple candy checkout and sales tracker.">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Candy Checkout</title>
<style>
:root{--green:#254d3b;--green2:#367356;--cream:#fff9ed;--paper:#fff;--ink:#25332b;--muted:#718077;--line:#e6e8df;--red:#b84c42}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}.wrap{max-width:900px;margin:auto;padding:16px}.header{background:var(--green);color:white;border-radius:18px;padding:20px 18px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}.header h1{font-size:23px;margin:0}.header p{margin:4px 0 0;opacity:.8;font-size:13px}.tabs{display:flex;gap:8px;margin-bottom:14px}.tab{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px;font-weight:700;color:var(--green)}.tab.active{background:var(--green);color:white;border-color:var(--green)}.panel{display:none}.panel.active{display:block}.layout{display:flex;flex-direction:column;gap:14px}.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}.card h2{font-size:17px;margin:0 0 12px}.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.product{background:var(--item-bg,#fbfcf8);border:1px solid var(--item-border,#d9ded4);border-radius:13px;padding:12px 8px;text-align:center;color:var(--ink);min-height:76px;cursor:pointer}.product:active{transform:scale(.98);filter:brightness(.97)}.product .name{font-weight:700;font-size:14px}.product .price{color:var(--green);font-weight:800;margin-top:3px}.cart-empty{color:var(--muted);font-size:14px;text-align:center;padding:20px 0}.cart-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.cart-row:last-child{border-bottom:0}.cart-name{font-size:14px;font-weight:650}.cart-sub{font-size:12px;color:var(--muted)}.qty{display:flex;align-items:center;gap:7px}.qty button{width:29px;height:29px;border:1px solid var(--line);background:white;border-radius:9px;font-weight:bold}.totalrow{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:15px}.totalrow.big{font-size:23px;font-weight:900;color:var(--green)}input,select{width:100%;padding:11px;border:1px solid #d9ddd4;border-radius:10px;font:inherit;background:#fff;margin:5px 0 10px}label{font-size:13px;font-weight:650}.btn{border:0;border-radius:11px;padding:11px 13px;font:inherit;font-weight:750;cursor:pointer}.primary{background:var(--green);color:white}.soft{background:#eaf1eb;color:var(--green)}.danger{background:#f8e9e6;color:var(--red)}.full{width:100%}.note{font-size:12px;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:#f5f8f3;border-radius:12px;padding:12px}.stat span{font-size:12px;color:var(--muted);display:block}.stat strong{font-size:21px;color:var(--green)}.manage-item{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:9px 0;font-size:14px}.manage-item:last-child{border-bottom:0}.manage-item button{padding:6px 9px}.manage-controls{display:flex;align-items:center;gap:5px;flex-shrink:0}.smallbtn{font-size:12px}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;padding:12px;z-index:10}.modal.show{display:flex}.modalbox{background:var(--cream);border-radius:18px;padding:16px;width:100%;max-width:460px}.modalbox h2{margin:0 0 12px}.actions{display:flex;gap:8px}.actions button{flex:1}.color-label{margin-top:4px}.color-picker{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}.swatch{width:30px;height:30px;border-radius:50%;border:2px solid #ffffff;box-shadow:0 0 0 1px #ccc;cursor:pointer}.swatch.selected{box-shadow:0 0 0 2px var(--green)}@media(max-width:650px){.wrap{padding:12px}.products{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body><div class="wrap">
<header class="header"><div><h1>🍬 Candy Checkout</h1><p>Your pocket-sized candy cash register</p></div><div style="font-size:27px">🍭</div></header>
<div class="tabs"><button class="tab active" data-tab="sell">🛒 Sell</button><button class="tab" data-tab="manage">⚙️ Menu</button><button class="tab" data-tab="sales">📊 Sales</button></div>
<section class="panel active" id="sell"><div class="layout"><div class="card" id="menuCard"><h2>Inventory</h2><p class="note">Tap an item to add it to the order.</p><div id="productGrid" class="products"></div></div><div class="card" id="cartCard"><h2>Current order</h2><div id="cart"></div><div class="totalrow big"><span>Total</span><span id="total">$0.00</span></div><button class="btn primary full" id="completeSale" style="margin-top:12px">Complete order</button><button class="btn danger full" id="clearCart" style="margin-top:8px">Clear order</button></div></div></section>
<section class="panel" id="manage"><div class="card"><h2>Add an item</h2><label for="itemName">Item name</label><input id="itemName" placeholder="e.g., Twix"><label for="itemPrice">Price ($)</label><input id="itemPrice" type="number" min="0" step=".01" inputmode="decimal" placeholder="e.g., 1.50"><label>Tile color</label><div id="newColorChoices" class="color-picker"></div><button class="btn primary full" id="addItem">Add to menu</button></div><div class="card"><h2>Your menu · rearrange items with ↑ ↓</h2><div id="manageList"></div></div></section>
<section class="panel" id="sales"><div class="card"><h2>Today's sales</h2><div class="stats"><div class="stat"><span>Revenue</span><strong id="revenue">$0.00</strong></div><div class="stat"><span>Transactions</span><strong id="transactions">0</strong></div><div class="stat"><span>Items sold</span><strong id="itemsSold">0</strong></div><div class="stat"><span>Average order</span><strong id="average">$0.00</strong></div></div><button class="btn soft full" id="resetSales" style="margin-top:12px">Reset today's sales</button></div><div class="card"><h2>Recent orders</h2><div id="history"></div></div></section>
</div>
<div class="modal" id="editModal"><div class="modalbox"><h2>Edit item</h2><label for="editName">Item name</label><input id="editName" placeholder="Item name"><label for="editPrice">Price ($)</label><input id="editPrice" type="number" min="0" step=".01" placeholder="Price"><label>Tile color</label><div id="editColorChoices" class="color-picker"></div><div class="actions"><button class="btn soft" id="cancelEdit">Cancel</button><button class="btn primary" id="saveEdit">Save</button></div></div></div>
<script>
(()=>{
const palette=[{name:'Strawberry',bg:'#FFE1E6',border:'#F5A7B8'},{name:'Peach',bg:'#FFE8D1',border:'#F3B27B'},{name:'Lemon',bg:'#FFF5C2',border:'#E9D36B'},{name:'Mint',bg:'#DDF5E5',border:'#9BD1AC'},{name:'Sky',bg:'#DDEEFF',border:'#9EC5EA'},{name:'Lavender',bg:'#EAE1FF',border:'#BBA5EA'},{name:'Grape',bg:'#E9DDF2',border:'#C2A0D4'},{name:'Rose',bg:'#F8DCEB',border:'#DDA3C6'},{name:'Aqua',bg:'#D8F3F2',border:'#91CDCA'},{name:'Cocoa',bg:'#EADFD5',border:'#C4A48A'}];
const defaults=[{id:1,name:'KitKat',price:2,color:0},{id:2,name:'Skittles',price:1,color:2},{id:3,name:'Sour Patch Kids',price:2,color:3},{id:4,name:'Lollipop',price:1,color:7},{id:5,name:'Kinder Bueno',price:3,color:5},{id:6,name:'Snickers',price:2,color:9}];
const read=(key,fallback)=>{try{let v=JSON.parse(localStorage.getItem(key));return v??fallback}catch{return fallback}};
let menu=read('cc-menu',defaults),cart={},sales=read('cc-sales',{date:today(),revenue:0,transactions:[],itemsSold:0}),editing=null,newColor=0,editColor=0;
function today(){return new Date().toLocaleDateString()}function money(n){return '$'+Number(n||0).toFixed(2)}function persist(){localStorage.setItem('cc-menu',JSON.stringify(menu));localStorage.setItem('cc-sales',JSON.stringify(sales))}function total(){return menu.reduce((sum,m)=>sum+(cart[m.id]||0)*m.price,0)}function quantity(){return Object.values(cart).reduce((a,b)=>a+b,0)}function daily(){if(sales.date!==today())sales={date:today(),revenue:0,transactions:[],itemsSold:0}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function colorOf(index){return palette[((Number(index)||0)%palette.length+palette.length)%palette.length]}
function renderMenu(){document.getElementById('productGrid').innerHTML=menu.map(m=>{let c=colorOf(m.color);return `<button class="product" data-add="${m.id}" style="--item-bg:${c.bg};--item-border:${c.border}"><div class="name">${esc(m.name)}</div><div class="price">${money(m.price)}</div></button>`}).join('')||'<p class="note">No items yet. Add some in the Menu tab.</p>'}
function renderCart(){const entries=menu.filter(m=>cart[m.id]);document.getElementById('cart').innerHTML=entries.length?entries.map(m=>`<div class="cart-row"><div><div class="cart-name">${esc(m.name)}</div><div class="cart-sub">${money(m.price)} each</div></div><div class="qty"><button data-minus="${m.id}" aria-label="Decrease">−</button><strong>${cart[m.id]}</strong><button data-plus="${m.id}" aria-label="Increase">+</button></div><strong>${money(m.price*cart[m.id])}</strong></div>`).join(''):'<div class="cart-empty">Your order is empty.<br>Tap items above to add them.</div>';document.getElementById('total').textContent=money(total())}
function renderColorChoices(id,selected){document.getElementById(id).innerHTML=palette.map((p,i)=>`<button type="button" class="swatch ${i===selected?'selected':''}" data-color="${i}" aria-label="${p.name}" title="${p.name}" style="background:${p.bg}"></button>`).join('')}
function renderManage(){document.getElementById('manageList').innerHTML=menu.map((m,i)=>{let c=colorOf(m.color);return `<div class="manage-item"><span style="display:flex;align-items:center;gap:8px"><span style="width:18px;height:18px;border-radius:5px;background:${c.bg};border:1px solid ${c.border};display:inline-block"></span>${esc(m.name)} · ${money(m.price)}</span><div class="manage-controls"><button class="btn soft smallbtn" data-up="${i}" ${i===0?'disabled':''}>↑</button><button class="btn soft smallbtn" data-down="${i}" ${i===menu.length-1?'disabled':''}>↓</button><button class="btn soft smallbtn" data-edit="${m.id}">Edit</button><button class="btn danger smallbtn" data-delete="${m.id}">×</button></div></div>`}).join('')||'<p class="note">Menu is empty.</p>'}
function renderSales(){daily();let tx=sales.transactions;document.getElementById('revenue').textContent=money(sales.revenue);document.getElementById('transactions').textContent=tx.length;document.getElementById('itemsSold').textContent=sales.itemsSold;document.getElementById('average').textContent=money(tx.length?sales.revenue/tx.length:0);document.getElementById('history').innerHTML=tx.length?[...tx].reverse().slice(0,20).map(t=>`<div class="manage-item"><span><strong>${money(t.total)}</strong><div class="note">${new Date(t.time).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})} · ${t.count} items</div></span><span class="note">${t.lines.map(x=>`${esc(x.name)} ×${x.qty}`).join(', ')}</span></div>`).join(''):'<p class="note">No completed orders yet.</p>'}
function render(){renderMenu();renderCart();renderManage();renderSales();renderColorChoices('newColorChoices',newColor);persist()}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===b.dataset.tab));renderSales()}));
document.getElementById('productGrid').addEventListener('click',e=>{let b=e.target.closest('[data-add]');if(b){let id=Number(b.dataset.add);cart[id]=(cart[id]||0)+1;renderCart()}});
document.getElementById('cart').addEventListener('click',e=>{let b=e.target.closest('[data-plus],[data-minus]');if(!b)return;let id=Number(b.dataset.plus||b.dataset.minus);if(b.dataset.plus)cart[id]=(cart[id]||0)+1;else cart[id]=Math.max(0,(cart[id]||0)-1);if(!cart[id])delete cart[id];renderCart()});
document.getElementById('clearCart').addEventListener('click',()=>{cart={};renderCart()});
document.getElementById('completeSale').addEventListener('click',()=>{let t=total();if(t<=0)return alert('Add at least one item first.');daily();let lines=menu.filter(m=>cart[m.id]).map(m=>({name:m.name,qty:cart[m.id],price:m.price}));sales.revenue+=t;sales.itemsSold+=quantity();sales.transactions.push({total:t,count:quantity(),time:new Date().toISOString(),lines});persist();cart={};render();alert(`Order completed!\nTotal: ${money(t)}`)});
document.getElementById('addItem').addEventListener('click',()=>{let name=document.getElementById('itemName').value.trim(),price=Number(document.getElementById('itemPrice').value);if(!name||!Number.isFinite(price)||price<0)return alert('Please enter an item name and valid price.');if(menu.some(m=>m.name.toLowerCase()===name.toLowerCase()))return alert('That item already exists.');menu.push({id:Date.now(),name,price,color:newColor});newColor=(newColor+1)%palette.length;document.getElementById('itemName').value='';document.getElementById('itemPrice').value='';render()});
document.getElementById('newColorChoices').addEventListener('click',e=>{let b=e.target.closest('[data-color]');if(!b)return;newColor=Number(b.dataset.color);renderColorChoices('newColorChoices',newColor)});
let modal=document.getElementById('editModal');document.getElementById('manageList').addEventListener('click',e=>{let edit=e.target.closest('[data-edit]'),del=e.target.closest('[data-delete]'),up=e.target.closest('[data-up]'),down=e.target.closest('[data-down]');if(up||down){let i=Number((up||down).dataset[up?'up':'down']),j=i+(up?-1:1);if(j>=0&&j<menu.length){[menu[i],menu[j]]=[menu[j],menu[i]];render()}return}if(edit){editing=menu.find(m=>m.id===Number(edit.dataset.edit));document.getElementById('editName').value=editing.name;document.getElementById('editPrice').value=editing.price;editColor=editing.color||0;renderColorChoices('editColorChoices',editColor);modal.classList.add('show')}if(del){let id=Number(del.dataset.delete);if(confirm('Delete this item from your menu?')){menu=menu.filter(m=>m.id!==id);delete cart[id];render()}}});
document.getElementById('editColorChoices').addEventListener('click',e=>{let b=e.target.closest('[data-color]');if(!b)return;editColor=Number(b.dataset.color);renderColorChoices('editColorChoices',editColor)});
document.getElementById('cancelEdit').addEventListener('click',()=>modal.classList.remove('show'));document.getElementById('saveEdit').addEventListener('click',()=>{if(!editing)return;let name=document.getElementById('editName').value.trim(),price=Number(document.getElementById('editPrice').value);if(!name||!Number.isFinite(price)||price<0)return alert('Please enter a valid name and price.');if(menu.some(m=>m.id!==editing.id&&m.name.toLowerCase()===name.toLowerCase()))return alert('Another item already uses that name.');editing.name=name;editing.price=price;editing.color=editColor;editing=null;modal.classList.remove('show');render()});
document.getElementById('resetSales').addEventListener('click',()=>{if(confirm('Reset today’s sales totals and order history? This cannot be undone.')){sales={date:today(),revenue:0,transactions:[],itemsSold:0};renderSales();persist()}});
if('serviceWorker' in navigator && location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});render();
})();
</script></body></html>
